<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#062a63">
<meta name="description" content="SPPG Pamoyanan 04 Management System">
<link rel="icon" href="icon-192.png">
<title>SPPG Pamoyanan 04</title>
<style>
:root{
 --navy:#062a63;--navy2:#0b3b82;--blue:#146dcc;--sky:#eaf3ff;--bg:#f4f7fb;
 --card:#fff;--line:#dce5f0;--text:#162235;--muted:#68778b;--gold:#c59a3d;
 --green:#16804b;--red:#c62828;--orange:#d97706;--shadow:0 5px 18px rgba(25,55,95,.08)
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.hidden{display:none!important}.muted{color:var(--muted);font-size:13px}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#031a3c,#0b5fbd)}
.login{width:min(420px,100%);background:#fff;border-radius:22px;padding:30px;box-shadow:0 25px 70px #0005}
.logo-box{width:72px;height:72px;border-radius:18px;background:#eef6ff;display:grid;place-items:center;overflow:hidden;margin-bottom:15px}
.logo-box img{width:100%;height:100%;object-fit:contain}.login h1{font-size:23px;margin:0 0 4px}
label{display:block;font-size:12px;font-weight:700;margin:13px 0 6px}.input,.select,.textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;outline:none}
.input:focus,.select:focus,.textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #146dcc20}
.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:700}.primary{background:linear-gradient(135deg,#0757b8,#1678dd);color:#fff}.secondary{background:#eaf1f8;color:var(--navy)}.danger{background:#fee2e2;color:var(--red)}.gold{background:#f8eed7;color:#73571d}.green{background:#e6f6ed;color:#12663c}.small{padding:7px 9px;font-size:12px}.wide{width:100%}
.app{min-height:100vh}.sidebar{position:fixed;left:0;top:0;bottom:0;width:235px;background:linear-gradient(180deg,#05285e,#062d69);color:#fff;padding:18px 13px;z-index:20}
.brand{text-align:center;padding:2px 5px 18px;border-bottom:1px solid #ffffff22}.brand img{width:68px;height:68px;object-fit:contain;background:#fff;border-radius:12px}.brand strong{display:block;margin-top:8px;font-size:14px}.brand span{font-size:10px;opacity:.75}
.nav{margin-top:14px}.nav button{display:flex;align-items:center;gap:9px;width:100%;padding:10px 11px;margin:4px 0;border:0;border-radius:8px;background:transparent;color:#fff;text-align:left;font-weight:600}.nav button:hover,.nav button.active{background:#ffffff18}
.main{margin-left:235px;min-height:100vh}.topbar{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:10}.top-title{font-size:13px;font-weight:700}.user{display:flex;gap:8px;align-items:center}.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#e8f2ff}.content{padding:20px;max-width:1450px;margin:auto}.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.page-head h2{margin:0;font-size:21px}.actions{display:flex;gap:8px;flex-wrap:wrap}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);padding:15px}.stat{min-height:105px}.stat .ico{font-size:22px}.stat .num{font-size:25px;font-weight:800;margin-top:7px}.stat .lbl{font-size:12px;color:var(--muted)}
.section{margin-top:14px}.section h3{font-size:15px;margin:0 0 8px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}.table{width:100%;border-collapse:collapse;min-width:700px;background:#fff}.table th,.table td{padding:9px 10px;border-bottom:1px solid var(--line);font-size:12px;text-align:left;vertical-align:top}.table th{background:#f4f7fb;font-size:11px;white-space:nowrap}.table tr:last-child td{border-bottom:0}.badge{display:inline-block;padding:4px 7px;border-radius:999px;font-size:10px;font-weight:800}.ok{background:#e7f7ee;color:#167344}.warn{background:#fff3d8;color:#8a5a00}.bad{background:#fee7e7;color:#a51e1e}
.progress{height:7px;background:#e8edf4;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:var(--blue);border-radius:20px}
.menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.menu-card{overflow:hidden;padding:0}.menu-img{height:150px;background:#eaf2fb;display:grid;place-items:center;font-size:44px;color:#7c8fa7}.menu-img img{width:100%;height:100%;object-fit:cover}.menu-body{padding:13px}.menu-body h4{margin:0 0 5px}.nutri{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:8px}.nutri div{font-size:11px;background:#f6f8fb;padding:6px;border-radius:6px}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 13px}.full{grid-column:1/-1}.check-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.check{border:1px solid var(--line);padding:9px;border-radius:8px;background:#fafcff}.check input{margin-right:6px}
.toolbar{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.toolbar>div{min-width:160px}.toolbar label{margin-top:0}
.empty{text-align:center;padding:30px;color:var(--muted)}
.modal-back{position:fixed;inset:0;background:#03162d99;display:grid;place-items:center;padding:15px;z-index:50}.modal{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:15px;padding:20px;box-shadow:0 25px 80px #0005}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.modal-head h3{margin:0}
.toast{position:fixed;right:18px;bottom:18px;background:#10233f;color:#fff;padding:11px 14px;border-radius:10px;z-index:100;box-shadow:0 8px 30px #0004;font-size:13px}
@media(max-width:1050px){.grid4{grid-template-columns:repeat(2,1fr)}.menu-grid{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr 1fr}}
@media(max-width:760px){
 .sidebar{width:70px;padding:12px 7px}.brand strong,.brand span,.nav button span{display:none}.brand img{width:52px;height:52px}.nav button{justify-content:center;padding:11px}.main{margin-left:70px}.topbar{padding:0 12px}.content{padding:12px}.grid4,.grid3,.grid2,.menu-grid{grid-template-columns:1fr}.page-head{align-items:flex-start;flex-direction:column}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.check-grid{grid-template-columns:1fr 1fr}.table{min-width:760px}
}
</style>
</head>
<body>

<div id="loginScreen" class="login-wrap">
  <div class="login">
    <div class="logo-box"><img src="icon-192.png" alt="Logo SPPG"></div>
    <h1>SPPG PAMOYANAN 04</h1>
    <div class="muted">Management System</div>
    <form id="loginForm">
      <label>ID Pengguna</label><input id="loginId" class="input" autocomplete="username" value="sppgpamoyanan04" required>
      <label>Password</label><input id="loginPass" class="input" type="password" autocomplete="current-password" value="sppgpmyn04" required>
      <button class="btn primary wide" style="margin-top:18px">Masuk ke Sistem</button>
    </form>
    <div id="loginMsg" class="muted" style="margin-top:10px"></div>
  </div>
</div>

<div id="app" class="app hidden">
<aside class="sidebar">
  <div class="brand"><img src="icon-192.png" alt="SPPG"><strong>SPPG PAMOYANAN 04</strong><span>BADAN GIZI NASIONAL</span></div>
  <nav class="nav">
    <button data-page="dashboard" class="active">🏠 <span>Dashboard</span></button>
    <button data-page="recipients">👥 <span>Data Penerima</span></button>
    <button data-page="menus">🍱 <span>Menu Harian</span></button>
    <button data-page="stock">📦 <span>Stok Bahan</span></button>
    <button data-page="volunteers">💛 <span>Data Relawan</span></button>
    <button data-page="reports">📊 <span>Laporan</span></button>
    <button data-page="downloads">⬇️ <span>Download</span></button>
    <button data-page="settings">⚙️ <span>Pengaturan</span></button>
    <button id="logoutBtn">🚪 <span>Keluar</span></button>
  </nav>
</aside>
<main class="main">
<header class="topbar"><div class="top-title" id="topTitle">Dashboard</div><div class="user"><img id="topAvatar" class="avatar" src="icon-192.png"><b id="topUser">Admin</b></div></header>
<div id="content" class="content"></div>
</main>
</div>

<div id="modalBack" class="modal-back hidden"><div class="modal"><div class="modal-head"><h3 id="modalTitle">Form</h3><button class="btn secondary" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<div id="toast" class="toast hidden"></div>

<script>
const KEY={
 rec:'sp04_rec',menu:'sp04_menu',vol:'sp04_vol',settings:'sp04_settings',
 stockorders:'sp04_stockorders',ingredients:'sp04_ingredients',stocklist:'sp04_stocklist'
};
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>new Date().toISOString().slice(0,10);
const get=k=>{try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}};
const set=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2200)}
function totalPorsi(r){return Number(r.kecil||0)+Number(r.besar||0)}

function seed(){
 if(!localStorage.getItem(KEY.rec)) set(KEY.rec,[
  {id:uid(),name:'SDN Ranggamekar',type:'SD',kecil:170,besar:130},
  {id:uid(),name:'SDN Pamoyanan 3',type:'SD',kecil:231,besar:270},
  {id:uid(),name:'SMP Negeri 13',type:'SMP',kecil:0,besar:831},
  {id:uid(),name:'Posyandu Mulya Harja',type:'Posyandu',kecil:499,besar:82}
 ]);
 if(!localStorage.getItem(KEY.menu)) set(KEY.menu,[
  {id:uid(),date:today(),name:'Nasi Putih, Ayam Kecap, Sayur Capcay, Tahu Goreng, Buah Pisang',img:'',small:{energy:450,protein:20,fat:12,carb:62,fiber:5},large:{energy:650,protein:29,fat:17,carb:91,fiber:7},note:'Menu contoh harian SPPG.'},
  {id:uid(),date:new Date(Date.now()-86400000).toISOString().slice(0,10),name:'Nasi, Ikan Goreng, Tumis Sayur, Tempe, Pepaya',img:'',small:{energy:460,protein:21,fat:13,carb:64,fiber:6},large:{energy:670,protein:30,fat:18,carb:94,fiber:8},note:''}
 ]);
 if(!localStorage.getItem(KEY.vol)) set(KEY.vol,[
  {id:uid(),name:'Ahmad Fauzi',division:'Dapur',address:'Pamoyanan',birth:'1990-02-12',phone:'081234567890',email:'ahmad@example.com',nik:'3200000000000001'},
  {id:uid(),name:'Siti Rahma',division:'Administrasi',address:'Pamoyanan',birth:'1993-06-21',phone:'081234567891',email:'siti@example.com',nik:'3200000000000002'},
  {id:uid(),name:'Dedi Irawan',division:'Logistik',address:'Pamoyanan',birth:'1988-11-03',phone:'081234567892',email:'dedi@example.com',nik:'3200000000000003'},
  {id:uid(),name:'Rina Lestari',division:'Distribusi',address:'Pamoyanan',birth:'1995-08-17',phone:'081234567893',email:'rina@example.com',nik:'3200000000000004'}
 ]);
 if(!localStorage.getItem(KEY.ingredients)) set(KEY.ingredients,[
  {id:uid(),name:'Beras',unit:'Karung',defaultQty:1},
  {id:uid(),name:'Minyak Goreng',unit:'Liter',defaultQty:10},
  {id:uid(),name:'Ayam',unit:'Kg',defaultQty:20},
  {id:uid(),name:'Telur',unit:'Kg',defaultQty:10},
  {id:uid(),name:'Sayuran',unit:'Kg',defaultQty:15},
  {id:uid(),name:'Tahu',unit:'Papan',defaultQty:5},
  {id:uid(),name:'Tempe',unit:'Papan',defaultQty:5},
  {id:uid(),name:'Buah',unit:'Kg',defaultQty:10}
 ]);
 if(!localStorage.getItem(KEY.stockorders)) set(KEY.stockorders,[]);
 if(!localStorage.getItem(KEY.stocklist)) set(KEY.stocklist,[]);
}
function login(){
 const id=$('loginId').value.trim(),pass=$('loginPass').value;
 if(id==='sppgpamoyanan04'&&pass==='sppgpmyn04'){sessionStorage.setItem('sp04_login','1');showApp();}else $('loginMsg').textContent='ID atau password tidak sesuai.';
}
function showApp(){$('loginScreen').classList.add('hidden');$('app').classList.remove('hidden');render('dashboard')}
function logout(){sessionStorage.removeItem('sp04_login');location.reload()}
function render(page){
 document.querySelectorAll('.nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
 $('topTitle').textContent={dashboard:'Dashboard',recipients:'Data Penerima',menus:'Menu Harian',stock:'Stok & Pemesanan Bahan',volunteers:'Data Relawan',reports:'Laporan',downloads:'Download',settings:'Pengaturan'}[page]||'SPPG Pamoyanan 04';
 ({dashboard:renderDashboard,recipients:renderRecipients,menus:renderMenus,stock:renderStock,volunteers:renderVolunteers,reports:renderReports,downloads:renderDownloads,settings:renderSettings}[page]||renderDashboard)();
}
document.querySelectorAll('.nav button[data-page]').forEach(b=>b.onclick=()=>render(b.dataset.page));
$('loginForm').onsubmit=e=>{e.preventDefault();login()};$('logoutBtn').onclick=logout;

function renderDashboard(){
 const r=get(KEY.rec),m=get(KEY.menu),s=get(KEY.stocklist),o=get(KEY.stockorders),v=get(KEY.vol);
 const kecil=r.reduce((a,x)=>a+Number(x.kecil||0),0),besar=r.reduce((a,x)=>a+Number(x.besar||0),0);
 $('content').innerHTML=`
 <div class="page-head"><div><h2>Dashboard</h2><div class="muted">Ringkasan informasi SPPG Pamoyanan 04 • Badan Gizi Nasional</div></div><div class="actions"><button class="btn primary" onclick="downloadCSV('dashboard')">⬇️ Download</button></div></div>
 <div class="grid4">
  <div class="card stat"><div class="ico">👥</div><div class="num">${r.length}</div><div class="lbl">Penerima Aktif</div></div>
  <div class="card stat"><div class="ico">🍱</div><div class="num">${kecil.toLocaleString('id-ID')}</div><div class="lbl">Total Porsi Kecil</div></div>
  <div class="card stat"><div class="ico">🍱</div><div class="num">${besar.toLocaleString('id-ID')}</div><div class="lbl">Total Porsi Besar</div></div>
  <div class="card stat"><div class="ico">📦</div><div class="num">${(kecil+besar).toLocaleString('id-ID')}</div><div class="lbl">Total Seluruh Porsi</div></div>
 </div>
 <div class="grid2 section">
  <div class="card"><h3>📊 Grafik Porsi per Penerima</h3>${r.map(x=>`<div style="margin:9px 0"><div style="display:flex;justify-content:space-between;font-size:11px"><span>${esc(x.name)}</span><b>${totalPorsi(x)}</b></div><div class="progress"><i style="width:${Math.min(100,totalPorsi(x)/Math.max(1,Math.max(...r.map(totalPorsi)))*100)}%"></i></div></div>`).join('')}</div>
  <div class="card"><h3>🍱 Menu Hari Ini</h3>${m.filter(x=>x.date===today()).slice(0,1).map(x=>`<b>${esc(x.name)}</b><p class="muted">${esc(x.note||'Menu harian SPPG')}</p><div class="nutri"><div>Energi kecil: ${x.small.energy} kkal</div><div>Energi besar: ${x.large.energy} kkal</div></div>`).join('')||'<div class="empty">Belum ada menu hari ini.</div>'}</div>
 </div>
 <div class="card section"><h3>📋 Ringkasan Penerima</h3><div class="table-wrap"><table class="table"><thead><tr><th>No</th><th>Nama Penerima</th><th>Jenis</th><th>Porsi Kecil</th><th>Porsi Besar</th><th>Total</th></tr></thead><tbody>${r.map((x,i)=>`<tr><td>${i+1}</td><td><b>${esc(x.name)}</b></td><td>${esc(x.type)}</td><td>${x.kecil}</td><td>${x.besar}</td><td><b>${totalPorsi(x)}</b></td></tr>`).join('')}</tbody></table></div></div>
 <div class="grid3 section"><div class="card"><b>📦 Stok Bahan</b><div class="num">${get(KEY.ingredients).length}</div><span class="muted">jenis bahan terdaftar</span></div><div class="card"><b>💛 Relawan Aktif</b><div class="num">${v.length}</div><span class="muted">orang terdaftar</span></div><div class="card"><b>💾 Database</b><p class="muted">Data tersimpan di perangkat/browser ini.</p><button class="btn gold small" onclick="backupData()">Backup Sekarang</button></div></div>`;
}
function renderRecipients(){
 const r=get(KEY.rec);
 $('content').innerHTML=`<div class="page-head"><div><h2>Data Penerima</h2><div class="muted">Kelola sekolah, posyandu dan jumlah porsi.</div></div><div class="actions"><button class="btn primary" onclick="recipientForm()">＋ Tambah Penerima</button><button class="btn secondary" onclick="downloadCSV('recipients')">⬇️ Download</button></div></div>
 <div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>No</th><th>Nama Penerima</th><th>Jenis</th><th>Porsi Kecil</th><th>Porsi Besar</th><th>Total</th><th>Aksi</th></tr></thead><tbody>${r.map((x,i)=>`<tr><td>${i+1}</td><td><b>${esc(x.name)}</b></td><td>${esc(x.type)}</td><td>${x.kecil}</td><td>${x.besar}</td><td><b>${totalPorsi(x)}</b></td><td><button class="btn secondary small" onclick="recipientForm('${x.id}')">Edit</button> <button class="btn danger small" onclick="delItem('${KEY.rec}','${x.id}','Penerima')">Hapus</button></td></tr>`).join('')}</tbody></table></div></div>`;
}
function recipientForm(id=''){
 const x=get(KEY.rec).find(a=>a.id===id)||{name:'',type:'SD',kecil:0,besar:0};
 openModal(id?'Edit Penerima':'Tambah Penerima',`<div class="form-grid"><div class="full"><label>Nama Penerima</label><input id="fName" class="input" value="${esc(x.name)}"></div><div><label>Jenis</label><select id="fType" class="select"><option ${x.type==='SD'?'selected':''}>SD</option><option ${x.type==='SMP'?'selected':''}>SMP</option><option ${x.type==='SMA'?'selected':''}>SMA</option><option ${x.type==='Posyandu'?'selected':''}>Posyandu</option></select></div><div><label>Porsi Kecil</label><input id="fSmall" class="input" type="number" min="0" value="${x.kecil}"></div><div><label>Porsi Besar</label><input id="fLarge" class="input" type="number" min="0" value="${x.besar}"></div></div><button class="btn primary wide" style="margin-top:16px" onclick="saveRecipient('${id}')">Simpan Data</button>`);
}
function saveRecipient(id){let a=get(KEY.rec),x={id:id||uid(),name:$('fName').value.trim(),type:$('fType').value,kecil:+$('fSmall').value||0,besar:+$('fLarge').value||0};if(!x.name)return toast('Nama wajib diisi');a=id?a.map(q=>q.id===id?x:q):[...a,x];set(KEY.rec,a);closeModal();render('recipients');toast('Data penerima tersimpan')}

function renderMenus(){
 const m=get(KEY.menu).sort((a,b)=>b.date.localeCompare(a.date));
 $('content').innerHTML=`<div class="page-head"><div><h2>Menu Harian</h2><div class="muted">Daftar menu, foto menu dan kandungan gizi porsi kecil/besar.</div></div><div class="actions"><button class="btn primary" onclick="menuForm()">＋ Tambah Menu</button><button class="btn secondary" onclick="downloadCSV('menus')">⬇️ Download</button></div></div>
 <div class="menu-grid">${m.map(x=>`<div class="card menu-card"><div class="menu-img">${x.img?`<img src="${x.img}" alt="Foto menu">`:'🍱'}</div><div class="menu-body"><div class="muted">${x.date}</div><h4>${esc(x.name)}</h4><div class="muted">${esc(x.note||'')}</div><div class="nutri"><div><b>Porsi Kecil</b><br>${x.small.energy} kkal • P ${x.small.protein}g • L ${x.small.fat}g • K ${x.small.carb}g • S ${x.small.fiber}g</div><div><b>Porsi Besar</b><br>${x.large.energy} kkal • P ${x.large.protein}g • L ${x.large.fat}g • K ${x.large.carb}g • S ${x.large.fiber}g</div></div><div style="margin-top:10px"><button class="btn secondary small" onclick="menuForm('${x.id}')">Edit</button> <button class="btn danger small" onclick="delItem('${KEY.menu}','${x.id}','Menu')">Hapus</button></div></div></div>`).join('')}</div>`;
}
function menuForm(id=''){
 const x=get(KEY.menu).find(a=>a.id===id)||{date:today(),name:'',img:'',note:'',small:{energy:0,protein:0,fat:0,carb:0,fiber:0},large:{energy:0,protein:0,fat:0,carb:0,fiber:0}};
 openModal(id?'Edit Menu':'Tambah Menu',`<div class="form-grid"><div><label>Tanggal</label><input id="mDate" class="input" type="date" value="${x.date}"></div><div><label>Nama Menu</label><input id="mName" class="input" value="${esc(x.name)}"></div><div class="full"><label>Foto Menu</label><input id="mImg" class="input" type="file" accept="image/*"><small class="muted">Foto disimpan di browser. Gunakan foto secukupnya.</small></div><div class="full"><label>Keterangan</label><textarea id="mNote" class="textarea" rows="2">${esc(x.note||'')}</textarea></div><div class="card" style="box-shadow:none;background:#f7faff"><b>PORSI KECIL</b>${nutriInputs('s',x.small)}</div><div class="card" style="box-shadow:none;background:#f7faff"><b>PORSI BESAR</b>${nutriInputs('l',x.large)}</div></div><button class="btn primary wide" style="margin-top:16px" onclick="saveMenu('${id}')">Simpan Menu</button>`);
 window._oldImg=x.img||'';
}
function nutriInputs(p,n){return `<label>Energi (kkal)</label><input id="${p}Energy" class="input" type="number" value="${n.energy}"><label>Protein (g)</label><input id="${p}Protein" class="input" type="number" value="${n.protein}"><label>Lemak (g)</label><input id="${p}Fat" class="input" type="number" value="${n.fat}"><label>Karbohidrat (g)</label><input id="${p}Carb" class="input" type="number" value="${n.carb}"><label>Serat (g)</label><input id="${p}Fiber" class="input" type="number" value="${n.fiber}">`}
function saveMenu(id){

function csvEscape(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function downloadCSV(type){
 const map={
  recipients:{name:'data_penerima',rows:get(KEY.rec).map((x,i)=>[i+1,x.name,x.type,x.kecil,x.besar,totalPorsi(x)]),head:['No','Nama Penerima','Jenis','Porsi Kecil','Porsi Besar','Total']},
  menus:{name:'menu_harian',rows:get(KEY.menu).map(x=>[x.date,x.name,x.small.energy,x.small.protein,x.small.fat,x.small.carb,x.small.fiber,x.large.energy,x.large.protein,x.large.fat,x.large.carb,x.large.fiber,x.note]),head:['Tanggal','Menu','Energi Kecil','Protein Kecil','Lemak Kecil','Karbohidrat Kecil','Serat Kecil','Energi Besar','Protein Besar','Lemak Besar','Karbohidrat Besar','Serat Besar','Keterangan']},
  orders:{name:'pemesanan_barang',rows:get(KEY.stockorders).map((x,i)=>[i+1,x.date,x.name,x.order,x.arrived,x.unit,x.match,x.condition,x.note]),head:['No','Tanggal','Nama Bahan','Qty Order','Qty Datang','Satuan','Sesuai/Tidak','Kondisi','Keterangan']},
  stockorders:{name:'pemesanan_barang',rows:get(KEY.stockorders).map((x,i)=>[i+1,x.date,x.name,x.order,x.arrived,x.unit,x.match,x.condition,x.note]),head:['No','Tanggal','Nama Bahan','Qty Order','Qty Datang','Satuan','Sesuai/Tidak','Kondisi','Keterangan']},
  stocklist:{name:'stok_barang',rows:get(KEY.stocklist).map((x,i)=>[x.date,i+1,x.name,x.qty,x.unit,x.note]),head:['Tanggal','No','Nama Bahan','Qty','Satuan','Keterangan']},
  volunteers:{name:'data_relawan',rows:get(KEY.vol).map((x,i)=>[i+1,x.name,x.division,x.address,x.birth,x.phone,x.email,x.nik]),head:['No','Nama','Divisi','Alamat','Tanggal Lahir','No HP','Email','NIK']}
 };
 if(type==='dashboard')return downloadCSV('recipients');
 if(type==='all'){const all=[];for(const k of ['recipients','menus','stockorders','stocklist','volunteers']){const d=map[k];all.push([k.toUpperCase()]);all.push(d.head);all.push(...d.rows);all.push([])}return saveCSV('sppg_pamoyanan04_semua_data.csv',all)}
 const d=map[type];if(!d)return;
 saveCSV(d.name+'_'+today()+'.csv',[d.head,...d.rows]);
}
function saveCSV(name,rows){
 const csv='\\ufeff'+rows.map(r=>r.map(csvEscape).join(',')).join('\\r\\n');
 const encoded='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
 const a=document.createElement('a');
 a.href=encoded;
 a.download=name;
 a.setAttribute('download',name);
 a.style.position='fixed';
 a.style.left='-9999px';
 document.body.appendChild(a);
 try{a.click();}catch(e){window.open(encoded,'_blank');}
 setTimeout(()=>{if(a.parentNode)a.parentNode.removeChild(a)},1500);
 toast('Download dimulai: '+name);
}
function downloadJSON(name,obj){
 const text='\\ufeff'+JSON.stringify(obj,null,2);
 const encoded='data:application/json;charset=utf-8,'+encodeURIComponent(text);
 const a=document.createElement('a');
 a.href=encoded;
 a.download=name;
 a.setAttribute('download',name);
 a.style.position='fixed';
 a.style.left='-9999px';
 document.body.appendChild(a);
 try{a.click();}catch(e){window.open(encoded,'_blank');}
 setTimeout(()=>{if(a.parentNode)a.parentNode.removeChild(a)},1500);
}
function generateReport(){
 const type=$('repType').value,period=$('repPeriod').value,start=$('repStart').value,end=$('repEnd').value;
 if(type==='all'){downloadCSV('all');return}
 const key=type==='menus'?KEY.menu:type==='stockorders'?KEY.stockorders:type==='stocklist'?KEY.stocklist:type==='volunteers'?KEY.vol:KEY.rec;
 let data=get(key);
 if(period==='range'){if(!start||!end)return toast('Isi tanggal mulai dan selesai');data=data.filter(x=>{const d=x.date||'';return d>=start&&d<=end})}
 const old=get(key);set(key,data);downloadCSV(type==='stockorders'?'stockorders':type);set(key,old);toast('Laporan dibuat sesuai filter');
}
